# Runs on every push and pull request: the API's typecheck and tests against a real
# PostgreSQL, the API's Docker build, and the app's typecheck. A red check means
# something broke; nothing is deployed from here.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: API — typecheck & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: manuver
          POSTGRES_PASSWORD: manuver_ci_password
          POSTGRES_DB: manuver_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U manuver -d manuver_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://manuver:manuver_ci_password@localhost:5432/manuver_test?schema=public
      TEST_DATABASE_URL: postgresql://manuver:manuver_ci_password@localhost:5432/manuver_test?schema=public
      # Throwaway values: CI never signs real tokens.
      JWT_ACCESS_SECRET: ci-access-secret-0123456789abcdefghijklmnop
      JWT_REFRESH_SECRET: ci-refresh-secret-0123456789abcdefghijklmno
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm test

  server-image:
    name: API — Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t manuver-api:ci ./server

  app:
    name: App — typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p .
